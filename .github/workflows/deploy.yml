name: Deploy GitHub Pages

# docs/06-roadmap.md의 공개 전 검토를 마친 뒤 수동으로 실행한다.
on:
  workflow_dispatch:
    inputs:
      release_checks_complete:
        description: '데이터 이용 조건, 인용, 실기기 및 접근성 등 공개 전 확인 목록을 검토했습니다.'
        type: boolean
        required: true
        default: false
      base_path:
        description: '사용자 도메인은 /, 기본값은 저장소 이름을 이용합니다.'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: inputs.release_checks_complete && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_BASE: ${{ inputs.base_path || format('/{0}/', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run data:check
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
